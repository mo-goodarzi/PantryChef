repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-toml
  # Ruff runs from the project environment, so the hooks and CI use the version pinned
  # in uv.lock (a separately pinned hook version drifted from it).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      # no absolute paths to this machine in anything committed (e2e reports once named
      # their temp cases files this way)
      - id: no-local-paths
        name: no local paths
        entry: uv run python scripts/check_local_paths.py
        language: system
        types: [text]
        exclude: ^scripts/check_local_paths\.py$
