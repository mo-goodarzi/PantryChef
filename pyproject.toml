[project]
name = "pantry-chef"
version = "0.0.1"
description = "Multi-agent recipe assistant that finds safe, verified recipes from what you have at home."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-openai>=1.6.6",
    "langfuse>=3.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pandas>=3.0.6",
    "pint>=0.25.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.40",
    "structlog>=24.1",
    "uvicorn>=0.30",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantry_chef"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
